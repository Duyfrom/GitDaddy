name: macOS

on:
  push:
    branches: [main, windows-app]
    tags: ["v*"]
  pull_request:
    paths: ["unified/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test, and package (Universal .dmg)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: unified
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust & Universal macOS targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: unified

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build and package Universal macOS .dmg
        run: ./packaging/package_mac_dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: GitDaddy-macOS-universal
          path: unified/dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "GitDaddy $TAG" --notes "GitDaddy $TAG for macOS (Universal: Apple Silicon + Intel) and Windows (x64)."
          fi
          gh release upload "$TAG" dist/* --clobber
