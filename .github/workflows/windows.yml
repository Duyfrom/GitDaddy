name: Windows

on:
  push:
    branches: [main, windows-app]
    tags: ["v*"]
  pull_request:
    paths: ["unified/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: unified
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: unified

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Build and package
        run: ./packaging/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: GitDaddy-windows-x64
          path: unified/dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --title "GitDaddy $env:TAG" --notes "GitDaddy $env:TAG for Windows (x64)."
          }
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release upload $env:TAG @files --clobber
